[project]
name = "local-face-recognition-pipeline"
version = "0.2.0"
description = "A local end-to-end face recognition pipeline built with YuNet, SFace, and OpenCV"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    "numpy>=1.26,<3",
    "opencv-python>=4.10,<5",
]

[project.scripts]
face-pipeline = "face_pipeline.cli:main"

[dependency-groups]
dev = [
    "pytest>=8,<9",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/face_pipeline"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
